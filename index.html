<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simi Match - Gracias por participar</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        min-height: 100vh;
        background: url('img/fondo.png') center center / cover no-repeat fixed;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
      }

      /* Overlay oscuro para contraste */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 20, 0.45);
        z-index: 0;
      }

      .container {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 30px 20px;
        max-width: 520px;
        width: 90%;
      }

      .titulo {
        width: 85%;
        max-width: 400px;
        margin-bottom: 10px;
        animation: floatTitle 3s ease-in-out infinite;
        filter: drop-shadow(0 4px 20px rgba(255, 90, 165, 0.5));
      }

      @keyframes floatTitle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      .cupido {
        width: 150px;
        margin: 0 auto 15px;
        display: block;
        animation: pulse 2s ease-in-out infinite;
        filter: drop-shadow(0 4px 15px rgba(255, 45, 133, 0.4));
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }

      .card {
        background: rgba(30, 0, 50, 0.75);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 90, 165, 0.6);
        border-radius: 20px;
        padding: 35px 30px;
        margin-bottom: 25px;
        box-shadow: 0 8px 40px rgba(255, 45, 133, 0.2);
      }

      .card h1 {
        color: #ffd1e8;
        font-size: clamp(22px, 5vw, 32px);
        margin-bottom: 12px;
        line-height: 1.3;
      }

      .card p {
        color: #e0c4f0;
        font-size: clamp(14px, 3.5vw, 18px);
        line-height: 1.6;
        margin-bottom: 8px;
      }

      .card .highlight {
        color: #ff5aa5;
        font-weight: bold;
      }

      /* Tiles flotantes decorativos */
      .floating-tiles {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .floating-tiles img {
        width: 48px;
        height: 48px;
        object-fit: contain;
        filter: drop-shadow(0 2px 8px rgba(255, 255, 255, 0.3));
      }

      .floating-tiles img:nth-child(1) { animation: bob 2.5s ease-in-out 0.0s infinite; }
      .floating-tiles img:nth-child(2) { animation: bob 2.5s ease-in-out 0.3s infinite; }
      .floating-tiles img:nth-child(3) { animation: bob 2.5s ease-in-out 0.6s infinite; }
      .floating-tiles img:nth-child(4) { animation: bob 2.5s ease-in-out 0.9s infinite; }
      .floating-tiles img:nth-child(5) { animation: bob 2.5s ease-in-out 1.2s infinite; }
      .floating-tiles img:nth-child(6) { animation: bob 2.5s ease-in-out 1.5s infinite; }

      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      .logo-simi {
        width: 60px;
        margin-top: 10px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="img/titulo.png" alt="Simi Match" class="titulo" />

      <img src="img/cupido.png" alt="Dr. Simi Cupido" class="cupido" />

      <div class="card">
        <h1>Gracias por participar</h1>
        <p>
          La din&aacute;mica de <span class="highlight">Simi Match</span> ha llegado a su fin.
        </p>
        <p>
          Fue incre&iacute;ble ver la energ&iacute;a y entusiasmo de todos los participantes.
        </p>
        <p style="margin-top: 16px; font-size: clamp(15px, 3.8vw, 20px);">
          <span class="highlight">Nos vemos el pr&oacute;ximo a&ntilde;o!</span>
        </p>
      </div>

      <div class="floating-tiles">
        <img src="img/heart.png" alt="Heart" />
        <img src="img/rocket.png" alt="Rocket" />
        <img src="img/coffee.png" alt="Coffee" />
        <img src="img/dog.png" alt="Dog" />
        <img src="img/plush.png" alt="Plush" />
        <img src="img/syringe.png" alt="Syringe" />
      </div>

      <img src="img/logo-simi.png" alt="Simi" class="logo-simi" />
    </div>
  </body>
</html>
