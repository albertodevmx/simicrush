<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Match Love</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #120018;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      canvas {
        border-radius: 16px;
        max-width: 100vw;
        max-height: 100vh;
        display: block;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Player Form Modal */
      #playerFormModal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 9999;
        justify-content: center;
        align-items: center;
      }

      #playerFormModal.active {
        display: flex;
      }

      .form-container {
        background: #2a0033;
        padding: 30px;
        border-radius: 16px;
        border: 3px solid #ff5aa5;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 8px 32px rgba(255, 45, 133, 0.3);
      }

      .form-container h2 {
        color: #ffd1e8;
        margin-bottom: 20px;
        text-align: center;
        font-size: 24px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        color: #ffd1e8;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: bold;
      }

      .form-group input {
        width: 100%;
        padding: 12px;
        border: 2px solid #ff5aa5;
        border-radius: 8px;
        background: #1a0022;
        color: #ffffff;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      .form-group input:focus {
        outline: none;
        border-color: #ffd1e8;
      }

      .form-group input::placeholder {
        color: #666;
      }

      .form-error {
        color: #ff2d85;
        font-size: 12px;
        margin-top: 5px;
        display: none;
      }

      .form-error.show {
        display: block;
      }

      .form-message {
        color: #ffd1e8;
        font-size: 12px;
        margin-top: 8px;
        text-align: center;
        display: none;
      }

      .form-message.show {
        display: block;
      }

      .form-button {
        width: 100%;
        padding: 14px;
        margin-top: 20px;
        background: #ff2d85;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
      }

      .form-button:hover:not(:disabled) {
        background: #ff5aa5;
        transform: scale(1.05);
      }

      .form-button:disabled {
        background: #999;
        cursor: not-allowed;
        opacity: 0.6;
      }

      .form-button:active:not(:disabled) {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Player Form Modal -->
    <div id="playerFormModal">
      <div class="form-container">
        <h2>Datos del Jugador</h2>
        <form id="playerForm">
          <div class="form-group">
            <label for="employeeNumber">Número de Empleado (5 dígitos)</label>
            <input
              type="text"
              id="employeeNumber"
              placeholder="Ej: 12345"
              maxlength="5"
              inputmode="numeric"
            />
            <div class="form-error" id="employeeError"></div>
          </div>

          <div class="form-group">
            <label for="playerName">Nombre</label>
            <input
              type="text"
              id="playerName"
              placeholder="Tu nombre"
              maxlength="50"
            />
            <div class="form-error" id="nameError"></div>
          </div>

          <div class="form-message" id="formMessage"></div>

          <button type="submit" class="form-button" id="submitBtn">ENTRAR AL JUEGO</button>
        </form>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
